<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Pedido Enviado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f; --green:#7db98a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-image:radial-gradient(ellipse at 50% 40%, rgba(125,185,138,.06), transparent 60%);
  }
  .check-ring{
    width:78px; height:78px; border-radius:50%;
    border:1.5px solid var(--green);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:26px;
  }
  .check-ring svg{ width:32px; height:32px; stroke:var(--green); }
  .title{
    font-family:'Fraunces',serif; font-weight:560; font-size:30px; color:var(--cream);
  }
  .sub{
    font-size:13.5px; color:var(--cream-soft); margin-top:10px; text-align:center; max-width:36ch;
  }
  .mesa-tag{
    position:absolute; top:28px; right:32px;
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--cream-soft);
    border:1px solid rgba(201,184,159,.25); padding:6px 12px; border-radius:20px;
  }
  .continuar{
    margin-top:36px;
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:13px 26px; border-radius:11px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="mesa-tag">Mesa 07</div>
  <div class="check-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
  </div>
  <div class="title">Pedido enviado!</div>
  <div class="sub">Já mandamos pra cozinha. Obrigado 🎉</div>
  <button class="continuar">Voltar ao cardápio</button>
</div>
</body>
</html>
