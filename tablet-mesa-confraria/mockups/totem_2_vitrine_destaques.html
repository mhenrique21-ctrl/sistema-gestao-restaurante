<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    background-image:url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1400');
    background-size:cover; background-position:center;
  }
  .overlay{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,10,8,.55) 0%, rgba(13,10,8,.35) 35%, rgba(13,10,8,.95) 88%);
  }
  .mesa-tag{
    position:absolute; top:28px; left:32px; z-index:2;
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--cream);
    border:1px solid rgba(243,233,218,.3); padding:6px 12px; border-radius:20px;
    backdrop-filter:blur(2px);
  }
  .comanda-chip{
    position:absolute; top:28px; right:32px; z-index:2;
    display:flex; align-items:center; gap:8px;
    font-family:'Inter',sans-serif; font-size:12px; color:var(--cream);
    background:rgba(207,154,79,.16); border:1px solid var(--gold);
    padding:7px 14px; border-radius:20px; backdrop-filter:blur(2px);
  }
  .comanda-chip b{ font-family:'Fraunces',serif; font-weight:560; color:var(--gold); font-size:13px; }
  .content{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    padding:0 56px 44px;
  }
  .eyebrow{
    font-family:'Inter',sans-serif; font-size:11.5px; letter-spacing:.14em;
    color:var(--gold); margin-bottom:12px;
  }
  .title{
    font-family:'Fraunces',serif; font-weight:560; font-size:46px; color:var(--cream);
    max-width:11ch; line-height:1.08;
  }
  .desc{
    font-size:14px; color:var(--cream-soft); margin-top:14px; max-width:46ch; line-height:1.5;
  }
  .row-bottom{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:34px;
  }
  .dots{ display:flex; gap:7px; }
  .pdot{ width:6px; height:6px; border-radius:50%; background:rgba(243,233,218,.3); }
  .pdot.active{ background:var(--gold); width:20px; border-radius:3px; }
  .cta{
    background:var(--gold); border:none; color:#241a10;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:15px 30px; border-radius:12px; cursor:pointer;
    display:flex; align-items:center; gap:10px;
  }
  .cta svg{ width:16px; height:16px; }
</style>
</head>
<body>
<div class="frame">
  <div class="overlay"></div>
  <div class="mesa-tag">Mesa 07</div>

  <div class="content">
    <div class="eyebrow">ENQUANTO ISSO, QUE TAL</div>
    <div class="title">Affogato pra fechar com chave de ouro?</div>
    <div class="desc">Sorvete de creme com um shot de espresso na hora — combina com quase tudo que já está na sua mesa.</div>

    <div class="row-bottom">
      <div class="dots">
        <div class="pdot active"></div>
        <div class="pdot"></div>
        <div class="pdot"></div>
      </div>
      <button class="cta">
        Continuar pedido
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
