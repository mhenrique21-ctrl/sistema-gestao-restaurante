<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Erro de Envio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f; --err:#a5453f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background-image:radial-gradient(ellipse at 50% 40%, rgba(165,69,63,.08), transparent 60%);
  }
  .icon-ring{
    width:78px; height:78px; border-radius:50%;
    border:1.5px solid var(--err);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:26px;
  }
  .icon-ring svg{ width:30px; height:30px; stroke:var(--err); }
  .title{ font-family:'Fraunces',serif; font-weight:560; font-size:28px; color:var(--cream); }
  .sub{ font-size:13.5px; color:var(--cream-soft); margin-top:10px; text-align:center; max-width:38ch; line-height:1.5; }
  .mesa-tag{
    position:absolute; top:28px; right:32px;
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--cream-soft);
    border:1px solid rgba(201,184,159,.25); padding:6px 12px; border-radius:20px;
  }
  .actions{ margin-top:32px; display:flex; gap:12px; }
  .btn-retry{
    background:var(--gold); border:none; color:#241a10;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:14px 26px; border-radius:12px; cursor:pointer;
  }
  .btn-secondary{
    background:transparent; border:1px solid rgba(201,184,159,.3); color:var(--cream-soft);
    font-family:'Inter',sans-serif; font-weight:500; font-size:14px;
    padding:14px 20px; border-radius:12px; cursor:pointer;
  }
  .note{ font-size:11px; color:var(--cream-soft); opacity:.6; margin-top:22px; }
</style>
</head>
<body>
<div class="frame">
  <div class="mesa-tag">Mesa 07</div>
  <div class="icon-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
  </div>
  <div class="title">Não conseguimos enviar seu pedido</div>
  <div class="sub">Pode ter sido a conexão. Seus itens continuam salvos na comanda — nada foi perdido.</div>
  <div class="actions">
    <button class="btn-secondary">Voltar à comanda</button>
    <button class="btn-retry">Tentar novamente</button>
  </div>
  <div class="note">Se continuar acontecendo, chame o garçom</div>
</div>
</body>
</html>
