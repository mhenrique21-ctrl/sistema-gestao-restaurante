<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Escanear QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f; --green:#6fae7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:#0f0b08;
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .camera-bg{
    position:absolute; inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, #14100c, #1c1610 60%, #14100c);
    opacity:.9;
  }
  .top-bar{
    position:relative; z-index:2; width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 34px;
  }
  .back{
    display:flex; align-items:center; gap:8px;
    font-family:'Inter',sans-serif; font-size:13px; color:var(--cream-soft);
    cursor:pointer;
  }
  .back svg{ width:16px; height:16px; }
  .mesa-tag{
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--cream);
    border:1px solid rgba(243,233,218,.3); padding:6px 12px; border-radius:20px;
  }

  .scan-area{
    position:relative; z-index:2;
    width:340px; height:340px;
    display:flex; align-items:center; justify-content:center;
  }
  .corner{
    position:absolute; width:44px; height:44px;
    border:3px solid var(--gold);
  }
  .c1{ top:0; left:0; border-right:none; border-bottom:none; border-radius:14px 0 0 0; }
  .c2{ top:0; right:0; border-left:none; border-bottom:none; border-radius:0 14px 0 0; }
  .c3{ bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 14px; }
  .c4{ bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 14px 0; }
  .scan-line{
    position:absolute; left:14px; right:14px; height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    top:50%;
    box-shadow:0 0 12px rgba(207,154,79,.8);
  }

  .instructions{
    position:relative; z-index:2;
    text-align:center; margin-top:36px;
  }
  .instr-title{
    font-family:'Fraunces',serif; font-weight:560; font-size:24px; color:var(--cream);
  }
  .instr-sub{
    font-size:13px; color:var(--cream-soft); margin-top:8px; max-width:38ch; margin-left:auto; margin-right:auto;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="camera-bg"></div>

  <div class="top-bar">
    <div class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar ao cardápio
    </div>
    <div class="mesa-tag">Mesa 07</div>
  </div>

  <div class="scan-area">
    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>
    <div class="scan-line"></div>
  </div>

  <div class="instructions">
    <div class="instr-title">Escaneie seu cartão</div>
    <div class="instr-sub">Aponte a câmera para o QR do seu cartão para confirmar o pedido</div>
  </div>
</div>
</body>
</html>
