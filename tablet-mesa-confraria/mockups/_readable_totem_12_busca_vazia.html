<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Busca Sem Resultado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,560&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --surface:#251b13; --line:#3a2c1e;
    --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    display:flex; flex-direction:column;
  }
  .head{ padding:26px 34px 16px; }
  .search-bar{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:14px 18px;
  }
  .search-bar svg{ width:18px; height:18px; color:var(--cream-soft); flex-shrink:0; }
  .search-input{ flex:1; font-family:'Inter',sans-serif; font-size:15px; color:var(--cream); }
  .search-cancel{ font-size:13px; color:var(--cream-soft); cursor:pointer; }

  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 40px;
  }
  .empty-icon{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-bottom:22px;
  }
  .empty-icon svg{ width:26px; height:26px; stroke:var(--cream-soft); opacity:.7; }
  .empty-title{ font-family:'Fraunces',serif; font-weight:520; font-size:19px; color:var(--cream); text-align:center; }
  .empty-title mark{ background:none; color:var(--gold); }
  .empty-sub{ font-size:13px; color:var(--cream-soft); margin-top:8px; text-align:center; max-width:34ch; line-height:1.5; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div class="search-input">xicrete</div>
      <div class="search-cancel">Cancelar</div>
    </div>
  </div>

  <div class="empty">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
    <div class="empty-title">Nada encontrado para "<mark>xicrete</mark>"</div>
    <div class="empty-sub">Tenta buscar pelo nome do prato ou navega pelas categorias ao lado</div>
  </div>
</div>
</body>
</html>
