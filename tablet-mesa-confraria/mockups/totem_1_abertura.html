<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Abertura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,560&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    background-image:radial-gradient(ellipse at 50% 40%, rgba(207,154,79,.07), transparent 60%);
  }
  .mark{ text-align:center; }
  .ring{
    width:64px; height:64px; margin:0 auto 26px;
    border:1px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .ring svg{ width:26px; height:26px; stroke:var(--gold); }
  .wordmark{
    font-family:'Fraunces',serif; font-weight:420; font-size:15px;
    letter-spacing:.28em; color:var(--cream-soft); margin-bottom:10px;
  }
  .title{
    font-family:'Fraunces',serif; font-weight:560; font-size:44px; color:var(--cream);
  }
  .loading{
    margin-top:46px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); opacity:.35; }
  .dot:nth-child(2){ opacity:.65; }
  .dot:nth-child(3){ opacity:1; }
  .mesa-tag{
    position:absolute; top:28px; right:32px;
    font-family:'Inter',sans-serif; font-size:11.5px; color:var(--cream-soft);
    border:1px solid rgba(201,184,159,.25); padding:6px 12px; border-radius:20px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="mesa-tag">Mesa 07</div>
  <div class="mark">
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 8h13a3 3 0 0 1 0 6h-1M4 8v7a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-2M4 8V5"/></svg>
    </div>
    <div class="wordmark">CONFRARIA</div>
    <div class="title">Café</div>
    <div class="loading">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
</div>
</body>
</html>
