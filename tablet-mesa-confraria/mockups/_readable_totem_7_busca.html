<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Confraria Café — Busca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,520;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c140e; --surface:#251b13; --surface-2:#2c2117; --line:#3a2c1e;
    --cream:#f3e9da; --cream-soft:#c9b89f; --gold:#cf9a4f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0d0a08; display:flex; align-items:center; justify-content:center;
    min-height:100vh; font-family:'Inter',sans-serif; padding:24px;
  }
  .frame{
    width:1180px; height:760px; background:var(--bg);
    border-radius:18px; overflow:hidden; position:relative;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(207,154,79,.08);
    display:flex; flex-direction:column;
  }
  .head{ padding:26px 34px 16px; }
  .search-bar{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--gold);
    border-radius:14px; padding:14px 18px;
  }
  .search-bar svg{ width:18px; height:18px; color:var(--gold); flex-shrink:0; }
  .search-input{ flex:1; font-family:'Inter',sans-serif; font-size:15px; color:var(--cream); }
  .search-cancel{ font-size:13px; color:var(--cream-soft); cursor:pointer; }
  .results-count{ font-size:12px; color:var(--cream-soft); margin-top:14px; }

  .list{ flex:1; overflow-y:auto; padding:0 34px 24px; }
  .result-row{
    display:flex; align-items:center; gap:16px;
    padding:15px 4px; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .result-thumb{
    width:64px; height:64px; border-radius:10px; flex-shrink:0;
    background-size:cover; background-position:center;
  }
  .result-info{ flex:1; min-width:0; }
  .result-name{ font-family:'Fraunces',serif; font-weight:520; font-size:15.5px; color:var(--cream); }
  .result-name mark{ background:none; color:var(--gold); }
  .result-cat{ font-size:11.5px; color:var(--cream-soft); opacity:.7; margin-top:2px; }
  .result-price{ font-family:'JetBrains Mono',monospace; font-weight:600; font-variant-numeric:tabular-nums; font-size:14.5px; color:var(--gold); white-space:nowrap; }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div class="search-input">capp</div>
      <div class="search-cancel">Cancelar</div>
    </div>
    <div class="results-count">2 resultados para "capp"</div>
  </div>

  <div class="list">
    <div class="result-row">
      <div class="result-thumb" style="background-image:url('data:image/jpeg;base64,[TRUNC]')"></div>
      <div class="result-info">
        <div class="result-name"><mark>Capp</mark>uccino Cremoso</div>
        <div class="result-cat">Cafés</div>
      </div>
      <div class="result-price">R$ 14,90</div>
    </div>

    <div class="result-row" style="border-bottom:none;">
      <div class="result-thumb" style="background-image:url('data:image/jpeg;base64,[TRUNC]')"></div>
      <div class="result-info">
        <div class="result-name"><mark>Capp</mark>uccino Gelado</div>
        <div class="result-cat">Bebidas</div>
      </div>
      <div class="result-price">R$ 16,90</div>
    </div>
  </div>
</div>
</body>
</html>
