<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seama PDV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4F1;
    --card: #FFFFFF;
    --sidebar: #2C2522;
    --sidebar-text: #C9C0B8;
    --header: #352E2A;
    --primary: #5A4638;
    --hover: #705A48;
    --text: #1D1D1B;
    --text2: #6B625D;
    --border: #E5DED6;
    --success: #5F8B64;
    --warning: #B88433;
    --danger: #A34B42;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    overscroll-behavior: none; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  .hidden { display: none !important; }

  /* ── Login ── */
  #login-screen { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--header); }
  #login-card { background: var(--card); border-radius: 20px; width: 100%; max-width: 380px; padding: 28px 26px; }
  #login-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); margin: 0 auto 14px; }
  #login-card h1 { font-size: 18px; font-weight: 600; text-align: center; margin: 0 0 4px; }
  #login-card p { font-size: 13px; color: var(--text2); text-align: center; margin: 0 0 20px; }
  #op-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; max-height: 220px; overflow-y: auto; }
  .op-card { border: 2px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; background: var(--card); }
  .op-card .av { width: 34px; height: 34px; border-radius: 999px; background: var(--bg); color: var(--primary); font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; margin: 0 auto 6px; }
  .op-card .nm { font-size: 12.5px; font-weight: 500; }
  .op-card.selected { border-color: var(--primary); background: #F1EAE3; }
  #pin-display { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; height: 16px; }
  #pin-display span { width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--border); }
  #pin-display span.filled { background: var(--primary); border-color: var(--primary); }
  #pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pin-btn { height: 52px; border-radius: 12px; border: none; background: var(--bg); font-size: 18px; font-weight: 600; color: var(--text); }
  .pin-btn:active { background: var(--border); }
  #login-error { color: var(--danger); font-size: 12.5px; text-align: center; min-height: 18px; margin-top: 10px; }

  /* ── App shell ── */
  #app { height: 100%; display: none; flex-direction: column; }
  #app.active { display: flex; }
  #header { height: 64px; flex-shrink: 0; background: var(--header); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  #header .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--primary); flex-shrink: 0; }
  #header .brand { color: #F6F4F1; font-size: 14px; font-weight: 600; line-height: 1.2; }
  #header .brand small { display: block; color: #B8AFA8; font-size: 11px; font-weight: 400; }
  #header input#search { flex: 1; max-width: 280px; height: 34px; border-radius: 10px; border: 1px solid #4A4038; background: #2C2522; color: #F6F4F1; padding: 0 12px; font-size: 13px; }
  #header input#search::placeholder { color: #8A7F76; }
  #header .clock { margin-left: auto; color: #B8AFA8; font-size: 11px; text-align: right; line-height: 1.3; }
  #cancel-sale-btn { height: 32px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--danger); background: transparent; color: #E39089; font-size: 12px; font-weight: 600; }

  #main { flex: 1; display: flex; min-height: 0; }

  #categories { width: 12%; min-width: 92px; background: var(--sidebar); padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .cat-btn { height: 54px; border-radius: 12px; border: none; background: transparent; color: var(--sidebar-text); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 500; gap: 2px; line-height: 1.15; padding: 4px 2px; text-align: center; }
  .cat-btn .ic { font-size: 16px; }
  .cat-btn.active { background: var(--primary); color: #fff; }

  #products-wrap { width: 63%; padding: 14px; overflow-y: auto; }
  #products-title { font-size: 13px; font-weight: 600; color: var(--text2); margin: 0 0 10px; }
  #products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .prod-card { position: relative; background: var(--card); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; border: none; }
  .prod-card .img { width: 52px; height: 52px; border-radius: 12px; background: var(--bg); }
  .prod-card .nm { font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2; min-height: 28px; display: flex; align-items: center; }
  .prod-card .pr { font-size: 13.5px; font-weight: 700; }
  .prod-card.unavailable { opacity: .4; pointer-events: none; }
  .prod-card .badge { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  #products-empty { color: var(--text2); font-size: 13px; padding: 20px; text-align: center; }

  #cart { width: 25%; min-width: 220px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  #cart-items { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #cart-empty { color: var(--text2); font-size: 13px; text-align: center; padding: 30px 10px; }
  .cart-item { display: flex; gap: 8px; align-items: flex-start; }
  .cart-item .img { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); flex-shrink: 0; }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .nm { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-item .un { font-size: 10.5px; color: var(--text2); }
  .cart-item .stepper { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
  .cart-item .stepper button { width: 19px; height: 19px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); font-size: 10.5px; line-height: 1; }
  .cart-item .stepper span { font-size: 12px; font-weight: 600; min-width: 12px; text-align: center; }
  .cart-item .sub { font-size: 12px; font-weight: 600; flex-shrink: 0; }
  #cart-footer { border-top: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 3px; }
  .cart-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }
  .cart-total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 3px; }
  .cart-total-line .lbl { font-size: 13px; font-weight: 600; }
  .cart-total-line .val { font-size: 21px; font-weight: 700; }
  #pay-btn { margin-top: 8px; height: 42px; border-radius: 14px; border: none; background: var(--success); color: #fff; font-size: 14px; font-weight: 600; }
  #pay-btn:disabled { opacity: .5; }
  #pay-hint { font-size: 10px; color: var(--text2); text-align: center; margin-top: 2px; }

  #footer-nav { height: 60px; flex-shrink: 0; background: var(--sidebar); display: flex; align-items: center; justify-content: center; gap: 32px; }
  .nav-btn { background: none; border: none; color: var(--sidebar-text); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; }
  .nav-btn .ic { font-size: 18px; }
  .nav-btn.active { color: #fff; }

  /* ── Configurações: categorias e produtos ── */
  #config-screen { flex: 1; display: none; min-height: 0; }
  #config-screen.active { display: flex; }
  #config-cats { width: 26%; min-width: 200px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #config-cats-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .cfg-cat-row { display: flex; align-items: center; gap: 8px; border-radius: 12px; border: 1px solid var(--border); padding: 10px 12px; background: var(--card); }
  .cfg-cat-row.active { border-color: var(--primary); background: #F1EAE3; }
  .cfg-cat-row .nm { flex: 1; font-size: 13px; font-weight: 500; cursor: pointer; }
  .cfg-cat-row button { background: none; border: none; color: var(--text2); font-size: 13px; padding: 2px 4px; }
  #config-cats-add { margin: 10px; height: 40px; border-radius: 12px; border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; }
  #config-products { flex: 1; padding: 14px; overflow-y: auto; }
  #config-products-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #config-products-head h3 { font-size: 14px; font-weight: 600; margin: 0; }
  #config-products-add { height: 36px; padding: 0 14px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 12.5px; font-weight: 600; }
  .cfg-prod-row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.04); padding: 10px 12px; margin-bottom: 8px; }
  .cfg-prod-row .img { width: 38px; height: 38px; border-radius: 9px; background: var(--bg); flex-shrink: 0; }
  .cfg-prod-row .nm { flex: 1; font-size: 13px; font-weight: 500; }
  .cfg-prod-row .nm small { display: block; color: var(--text2); font-size: 11px; font-weight: 400; }
  .cfg-prod-row .pr { font-size: 13px; font-weight: 600; }
  .cfg-prod-row .tag { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .cfg-prod-row .tag.off { background: #FBEAE8; color: var(--danger); }
  .cfg-prod-row button { background: none; border: none; color: var(--text2); font-size: 14px; padding: 2px 6px; }
  .field-group { margin-bottom: 12px; }
  .field-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }
  .field-group input, .field-group textarea, .field-group select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13.5px; font-family: inherit; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field-group { flex: 1; }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }

  /* ── Modal genérico ── */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,16,10,.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-sheet { background: var(--card); border-radius: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; padding: 20px; }
  .modal-sheet h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .modal-sheet .sub { font-size: 12.5px; color: var(--text2); margin: 0 0 16px; }
  .pay-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .pay-method-btn { border: 2px solid var(--border); border-radius: 12px; padding: 12px 8px; text-align: center; background: var(--card); font-size: 12.5px; font-weight: 500; }
  .pay-method-btn.selected { border-color: var(--primary); background: #F1EAE3; }
  .pay-amount-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .pay-amount-row input { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--border); padding: 0 10px; font-size: 14px; }
  .pay-amount-row button { height: 40px; padding: 0 14px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600; }
  .pay-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .pay-list-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 12.5px; }
  .pay-list-item button { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 700; }
  .pay-summary { display: flex; flex-direction: column; gap: 3px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 13.5px; font-weight: 600; }
  .modal-actions button.primary { border: none; background: var(--success); color: #fff; }
  .modal-actions button.primary:disabled { opacity: .5; }
  #pay-error { color: var(--danger); font-size: 12px; text-align: center; min-height: 16px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 200; }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div id="login-card">
    <div id="login-logo"></div>
    <h1>Seama PDV</h1>
    <p id="login-sub">Selecione seu usuário</p>
    <div id="op-list"></div>
    <div id="pin-section" class="hidden">
      <div id="pin-display"></div>
      <div id="pin-pad">
        <button class="pin-btn" data-d="1">1</button>
        <button class="pin-btn" data-d="2">2</button>
        <button class="pin-btn" data-d="3">3</button>
        <button class="pin-btn" data-d="4">4</button>
        <button class="pin-btn" data-d="5">5</button>
        <button class="pin-btn" data-d="6">6</button>
        <button class="pin-btn" data-d="7">7</button>
        <button class="pin-btn" data-d="8">8</button>
        <button class="pin-btn" data-d="9">9</button>
        <button class="pin-btn" id="pin-back">⌫</button>
        <button class="pin-btn" data-d="0">0</button>
        <button class="pin-btn" id="pin-cancel">✕</button>
      </div>
    </div>
    <div id="login-error"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div id="header">
    <div class="logo"></div>
    <div class="brand">Seama<small id="header-sale-info">Nova venda · —</small></div>
    <input id="search" placeholder="Buscar produto...">
    <div class="clock"><span id="clock-date">—</span><br><span id="clock-time">—</span></div>
    <button id="cancel-sale-btn">Cancelar venda</button>
  </div>

  <div id="main">
    <div id="categories"></div>
    <div id="products-wrap">
      <div id="products-title">—</div>
      <div id="products-grid"></div>
      <div id="products-empty" class="hidden">Sem produtos nesta categoria</div>
    </div>
    <div id="cart">
      <div id="cart-items"><div id="cart-empty">Toque num produto pra adicionar</div></div>
      <div id="cart-footer">
        <div class="cart-line"><span>Subtotal</span><span id="cart-subtotal">R$ 0,00</span></div>
        <div class="cart-line"><span>Desconto</span><span id="cart-discount">R$ 0,00</span></div>
        <div class="cart-total-line"><span class="lbl">Total</span><span class="val" id="cart-total">R$ 0,00</span></div>
        <button id="pay-btn" disabled>Receber pagamento</button>
        <div id="pay-hint">Ao confirmar, imprime a ficha de cada produto</div>
      </div>
    </div>
  </div>

  <div id="config-screen">
    <div id="config-cats">
      <div id="config-cats-list"></div>
      <button id="config-cats-add">+ Nova categoria</button>
    </div>
    <div id="config-products">
      <div id="config-products-head">
        <h3 id="config-products-title">Categorias</h3>
        <button id="config-products-add" class="hidden">+ Novo produto</button>
      </div>
      <div id="config-products-list"></div>
    </div>
  </div>

  <div id="footer-nav">
    <button class="nav-btn active" id="nav-vendas"><span class="ic">🧾</span>Vendas</button>
    <button class="nav-btn" id="nav-caixa"><span class="ic">💰</span>Caixa</button>
    <button class="nav-btn" id="nav-config"><span class="ic">⚙️</span>Configurações</button>
  </div>
</div>

<script>
const API = '';
let TOKEN = localStorage.getItem('seama_token') || null;
let CURRENT_USER = null;
let selectedOperator = null;
let pin = '';

let categories = [];
let products = [];
let activeCategory = null;
let cart = []; // [{product_id, name, price, quantity}]
let discount = 0;

function fmt(v) { return 'R$ ' + parseFloat(v || 0).toFixed(2).replace('.', ','); }
function authHeaders(extra) { return Object.assign({ Authorization: 'Bearer ' + TOKEN }, extra || {}); }
function showToast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ── Login ──────────────────────────────────────────
async function loadOperators() {
  const list = document.getElementById('op-list');
  list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text2);font-size:13px">Carregando...</div>';
  try {
    const res = await fetch(`${API}/api/auth/operators`);
    const ops = await res.json();
    if (!res.ok || !Array.isArray(ops)) { list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--danger);font-size:13px">Erro ao carregar</div>'; return; }
    list.innerHTML = ops.map(op => `
      <button class="op-card" data-id="${op.id}" data-name="${op.username}">
        <div class="av">${(op.username || '?').slice(0, 2).toUpperCase()}</div>
        <div class="nm">${op.username}</div>
      </button>
    `).join('');
    list.querySelectorAll('.op-card').forEach(btn => btn.addEventListener('click', () => selectOperator(btn.dataset.id, btn.dataset.name)));
  } catch (e) {
    list.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--danger);font-size:13px">Erro de conexão</div>';
  }
}

function selectOperator(id, name) {
  selectedOperator = name;
  pin = '';
  document.getElementById('login-sub').textContent = name;
  document.getElementById('op-list').classList.add('hidden');
  document.getElementById('pin-section').classList.remove('hidden');
  document.getElementById('login-error').textContent = '';
  renderPinDots();
}

function renderPinDots() {
  const el = document.getElementById('pin-display');
  el.innerHTML = Array.from({ length: 6 }, (_, i) => `<span class="${i < pin.length ? 'filled' : ''}"></span>`).join('');
}

document.getElementById('pin-pad').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.id === 'pin-cancel') {
    selectedOperator = null; pin = '';
    document.getElementById('op-list').classList.remove('hidden');
    document.getElementById('pin-section').classList.add('hidden');
    document.getElementById('login-sub').textContent = 'Selecione seu usuário';
    return;
  }
  if (btn.id === 'pin-back') { pin = pin.slice(0, -1); renderPinDots(); return; }
  if (btn.dataset.d !== undefined && pin.length < 6) {
    pin += btn.dataset.d;
    renderPinDots();
    // Só tenta login com o PIN completo (6 dígitos) — tentar a cada dígito
    // a partir do 4º fazia um PIN de 6 dígitos falhar no meio da digitação
    // (ex: "1234" já tentava logar e limpava tudo antes do usuário terminar).
    if (pin.length === 6) await tryLogin();
  }
});

async function tryLogin() {
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: selectedOperator, pin }),
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Credenciais inválidas';
      pin = '';
      renderPinDots();
      return;
    }
    TOKEN = data.token;
    CURRENT_USER = data.user;
    localStorage.setItem('seama_token', TOKEN);
    localStorage.setItem('seama_user', JSON.stringify(CURRENT_USER));
    enterApp();
  } catch (e) {
    errEl.textContent = 'Erro de conexão';
  }
}

// ── App shell ──────────────────────────────────────
function enterApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  startClock();
  loadCatalog();
}

function startClock() {
  const tick = () => {
    const now = new Date();
    document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-BR');
    document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  };
  tick();
  setInterval(tick, 30000);
}

async function loadCatalog() {
  try {
    const [catRes, prodRes] = await Promise.all([
      fetch(`${API}/api/categories`, { headers: authHeaders() }),
      fetch(`${API}/api/products`, { headers: authHeaders() }),
    ]);
    categories = await catRes.json();
    products = await prodRes.json();
    if (!Array.isArray(categories)) categories = [];
    if (!Array.isArray(products)) products = [];
    renderCategories();
    if (categories.length) selectCategory(categories.find(c => c.active !== false)?.id || categories[0].id);
  } catch (e) {
    showToast('Erro ao carregar catálogo');
  }
}

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = categories.filter(c => c.active !== false).map(c => `
    <button class="cat-btn ${c.id === activeCategory ? 'active' : ''}" data-id="${c.id}">
      <span class="ic">${c.icon || '🏷️'}</span>${c.name}
    </button>
  `).join('');
  el.querySelectorAll('.cat-btn').forEach(btn => btn.addEventListener('click', () => selectCategory(btn.dataset.id)));
}

function selectCategory(id) {
  activeCategory = id;
  renderCategories();
  renderProducts();
}

function renderProducts() {
  const cat = categories.find(c => c.id === activeCategory);
  document.getElementById('products-title').textContent = (cat?.name || '').toUpperCase();
  const searchTerm = document.getElementById('search').value.trim().toLowerCase();
  let list = products.filter(p => p.category_id === activeCategory);
  if (searchTerm) list = products.filter(p => p.name.toLowerCase().includes(searchTerm));
  const grid = document.getElementById('products-grid');
  const empty = document.getElementById('products-empty');
  if (!list.length) { grid.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  grid.innerHTML = list.map(p => {
    const inCart = cart.find(i => i.product_id === p.id);
    const unavailable = p.available === false || p.active === false;
    return `
      <button class="prod-card ${unavailable ? 'unavailable' : ''}" data-id="${p.id}">
        ${inCart ? `<span class="badge">${inCart.quantity}</span>` : ''}
        <div class="img" style="${p.image_url ? `background-image:url('${p.image_url}');background-size:cover` : ''}"></div>
        <div class="nm">${p.name}</div>
        <div class="pr">${fmt(p.price)}</div>
      </button>
    `;
  }).join('');
  grid.querySelectorAll('.prod-card').forEach(btn => btn.addEventListener('click', () => addToCart(btn.dataset.id)));
}

document.getElementById('search').addEventListener('input', renderProducts);

function addToCart(productId) {
  const prod = products.find(p => p.id === productId);
  if (!prod || prod.available === false) return;
  const existing = cart.find(i => i.product_id === productId);
  if (existing) existing.quantity += 1;
  else cart.push({ product_id: prod.id, name: prod.name, price: parseFloat(prod.price), quantity: 1 });
  renderCart();
  renderProducts();
}

function changeCartQty(productId, delta) {
  const item = cart.find(i => i.product_id === productId);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) cart = cart.filter(i => i.product_id !== productId);
  renderCart();
  renderProducts();
}

function renderCart() {
  const el = document.getElementById('cart-items');
  if (!cart.length) {
    el.innerHTML = '<div id="cart-empty">Toque num produto pra adicionar</div>';
  } else {
    el.innerHTML = cart.map(i => `
      <div class="cart-item">
        <div class="img"></div>
        <div class="info">
          <div class="nm">${i.name}</div>
          <div class="un">${fmt(i.price)} un.</div>
          <div class="stepper">
            <button data-id="${i.product_id}" data-d="-1">−</button>
            <span>${i.quantity}</span>
            <button data-id="${i.product_id}" data-d="1">+</button>
          </div>
        </div>
        <div class="sub">${fmt(i.price * i.quantity)}</div>
      </div>
    `).join('');
    el.querySelectorAll('.stepper button').forEach(btn => btn.addEventListener('click', () => changeCartQty(btn.dataset.id, parseInt(btn.dataset.d, 10))));
  }
  const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const total = Math.max(0, subtotal - discount);
  document.getElementById('cart-subtotal').textContent = fmt(subtotal);
  document.getElementById('cart-discount').textContent = fmt(discount);
  document.getElementById('cart-total').textContent = fmt(total);
  document.getElementById('pay-btn').disabled = cart.length === 0;
}

document.getElementById('cancel-sale-btn').addEventListener('click', () => {
  if (!cart.length) return;
  if (!confirm('Cancelar a venda atual? O carrinho será esvaziado.')) return;
  cart = []; discount = 0;
  renderCart(); renderProducts();
});

// ── Pagamento ──────────────────────────────────────
const PAY_METHOD_LABELS = {
  dinheiro: '💵 Dinheiro', pix: '📱 PIX', cartao_debito: '💳 Débito',
  cartao_credito: '💳 Crédito', vale_alimentacao: '🍽️ Vale Alim.', vale_refeicao: '🍔 Vale Ref.',
};
let payPayments = [];
let payMethodSelected = null;

document.getElementById('pay-btn').addEventListener('click', openPayModal);

function cartTotalCents() {
  const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  return Math.round(Math.max(0, subtotal - discount) * 100);
}
function payPaidCents() { return payPayments.reduce((s, p) => s + Math.round(p.amount * 100), 0); }
function payRemainingCents() { return Math.max(0, cartTotalCents() - payPaidCents()); }

function openPayModal() {
  payPayments = [];
  payMethodSelected = null;
  renderPayModal();
}

function renderPayModal() {
  let backdrop = document.getElementById('pay-modal-backdrop');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'pay-modal-backdrop';
    backdrop.className = 'modal-backdrop';
    document.body.appendChild(backdrop);
  }
  const remaining = payRemainingCents();
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h2>Receber pagamento</h2>
      <div class="sub">Total: ${fmt(cartTotalCents() / 100)} · Restante: ${fmt(remaining / 100)}</div>
      <div class="pay-methods">
        ${Object.entries(PAY_METHOD_LABELS).map(([m, label]) => `
          <button class="pay-method-btn ${payMethodSelected === m ? 'selected' : ''}" data-m="${m}">${label}</button>
        `).join('')}
      </div>
      <div class="pay-amount-row">
        <input type="number" step="0.01" id="pay-amount-input" placeholder="0,00" value="${remaining > 0 ? (remaining / 100).toFixed(2) : ''}">
        <button id="pay-add-btn">Adicionar</button>
      </div>
      <div class="pay-list">
        ${payPayments.map((p, i) => `
          <div class="pay-list-item"><span>${PAY_METHOD_LABELS[p.method]} — ${fmt(p.amount)}</span><button data-i="${i}">✕</button></div>
        `).join('')}
      </div>
      <div class="pay-summary">
        <div class="cart-line"><span>Recebido</span><span>${fmt(payPaidCents() / 100)}</span></div>
        <div class="cart-line"><span>Restante</span><span>${fmt(remaining / 100)}</span></div>
      </div>
      <div id="pay-error"></div>
      <div class="modal-actions">
        <button id="pay-cancel-btn">Cancelar</button>
        <button class="primary" id="pay-confirm-btn" ${remaining > 0 ? 'disabled' : ''}>Confirmar e imprimir</button>
      </div>
    </div>
  `;
  backdrop.querySelectorAll('.pay-method-btn').forEach(btn => btn.addEventListener('click', () => {
    payMethodSelected = btn.dataset.m;
    renderPayModal();
  }));
  backdrop.querySelector('#pay-add-btn').addEventListener('click', () => {
    const errEl = backdrop.querySelector('#pay-error');
    if (!payMethodSelected) { errEl.textContent = 'Escolha uma forma de pagamento'; return; }
    const amount = parseFloat(backdrop.querySelector('#pay-amount-input').value);
    if (!(amount > 0)) { errEl.textContent = 'Informe um valor válido'; return; }
    payPayments.push({ method: payMethodSelected, amount });
    payMethodSelected = null;
    renderPayModal();
  });
  backdrop.querySelectorAll('.pay-list-item button').forEach(btn => btn.addEventListener('click', () => {
    payPayments.splice(parseInt(btn.dataset.i, 10), 1);
    renderPayModal();
  }));
  backdrop.querySelector('#pay-cancel-btn').addEventListener('click', closePayModal);
  backdrop.querySelector('#pay-confirm-btn').addEventListener('click', confirmSale);
}

function closePayModal() {
  const backdrop = document.getElementById('pay-modal-backdrop');
  if (backdrop) backdrop.remove();
}

async function confirmSale() {
  const btn = document.getElementById('pay-confirm-btn');
  const errEl = document.getElementById('pay-error');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch(`${API}/api/sales`, {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })),
        payments: payPayments,
        discount,
      }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Erro ao registrar venda'; btn.disabled = false; btn.textContent = 'Confirmar e imprimir'; return; }
    printFichas(data);
    closePayModal();
    cart = []; discount = 0;
    renderCart(); renderProducts();
    showToast(`✅ Venda #${data.sale_number} concluída!`);
  } catch (e) {
    errEl.textContent = 'Erro de conexão';
    btn.disabled = false;
    btn.textContent = 'Confirmar e imprimir';
  }
}

// Impressão real (SDK Elgin via Capacitor) entra numa fase seguinte — por
// enquanto só simula, uma ficha por unidade vendida (sem quantidade impressa).
function printFichas(sale) {
  const fichas = [];
  for (const item of sale.items) {
    for (let i = 0; i < item.quantity; i++) fichas.push({ name: item.product_name, price: item.unit_price });
  }
  console.log(`[print] ${fichas.length} ficha(s) da venda #${sale.sale_number}:`, fichas);
}

// ── Navegação inferior (Vendas/Caixa/Configurações) ─
// Consulta de vendas e caixa vêm na próxima fase — por enquanto só
// vender e configurar (categorias/produtos) estão funcionais.
function setActiveNav(id) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === id));
}

document.getElementById('nav-vendas').addEventListener('click', () => {
  document.getElementById('config-screen').classList.remove('active');
  document.getElementById('main').style.display = 'flex';
  setActiveNav('nav-vendas');
});
document.getElementById('nav-caixa').addEventListener('click', () => showToast('Em breve'));
document.getElementById('nav-config').addEventListener('click', () => {
  if (!['admin', 'gerente'].includes(CURRENT_USER?.role)) { showToast('Só admin ou gerente acessa configurações'); return; }
  document.getElementById('main').style.display = 'none';
  document.getElementById('config-screen').classList.add('active');
  setActiveNav('nav-config');
  renderConfigCategories();
});

// ── Configurações: categorias ────────────────────────
let configActiveCategory = null;

function renderConfigCategories() {
  const el = document.getElementById('config-cats-list');
  if (!categories.length) { el.innerHTML = '<div style="color:var(--text2);font-size:12.5px;text-align:center;padding:16px">Nenhuma categoria ainda</div>'; }
  else {
    el.innerHTML = categories.map(c => `
      <div class="cfg-cat-row ${c.id === configActiveCategory ? 'active' : ''}">
        <span class="nm" data-id="${c.id}">${c.icon || ''} ${c.name}${c.active === false ? ' (inativa)' : ''}</span>
        <button data-edit="${c.id}">✎</button>
        <button data-del="${c.id}">🗑</button>
      </div>
    `).join('');
    el.querySelectorAll('.nm').forEach(nmEl => nmEl.addEventListener('click', () => selectConfigCategory(nmEl.dataset.id)));
    el.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openCategoryModal(btn.dataset.edit)));
    el.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => deleteCategory(btn.dataset.del)));
  }
  if (!configActiveCategory && categories.length) configActiveCategory = categories[0].id;
  renderConfigProducts();
}

function selectConfigCategory(id) {
  configActiveCategory = id;
  renderConfigCategories();
}

document.getElementById('config-cats-add').addEventListener('click', () => openCategoryModal(null));

function openCategoryModal(categoryId) {
  const cat = categories.find(c => c.id === categoryId) || null;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'cat-modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet" style="max-width:380px">
      <h2>${cat ? 'Editar categoria' : 'Nova categoria'}</h2>
      <div class="field-group"><label>Nome</label><input id="cat-name" value="${cat?.name || ''}"></div>
      <div class="field-row">
        <div class="field-group"><label>Ícone (emoji)</label><input id="cat-icon" value="${cat?.icon || ''}" maxlength="4"></div>
        <div class="field-group"><label>Ordem</label><input id="cat-sort" type="number" value="${cat?.sort_order ?? 0}"></div>
      </div>
      ${cat ? `<label class="toggle-row"><input type="checkbox" id="cat-active" ${cat.active !== false ? 'checked' : ''}> Categoria ativa</label>` : ''}
      <div id="cat-error" style="color:var(--danger);font-size:12px;min-height:16px"></div>
      <div class="modal-actions">
        <button id="cat-cancel">Cancelar</button>
        <button class="primary" id="cat-save">Salvar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cat-cancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#cat-save').addEventListener('click', async () => {
    const name = backdrop.querySelector('#cat-name').value.trim();
    const errEl = backdrop.querySelector('#cat-error');
    if (!name) { errEl.textContent = 'Nome é obrigatório'; return; }
    const payload = {
      name,
      icon: backdrop.querySelector('#cat-icon').value.trim() || null,
      sort_order: parseInt(backdrop.querySelector('#cat-sort').value, 10) || 0,
    };
    if (cat) payload.active = backdrop.querySelector('#cat-active').checked;
    try {
      const res = await fetch(`${API}/api/categories${cat ? '/' + cat.id : ''}`, {
        method: cat ? 'PATCH' : 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Erro ao salvar'; return; }
      backdrop.remove();
      if (!cat) configActiveCategory = data.id;
      await loadCatalog();
      renderConfigCategories();
      showToast('Categoria salva!');
    } catch (e) { errEl.textContent = 'Erro de conexão'; }
  });
}

async function deleteCategory(id) {
  if (!confirm('Excluir esta categoria? Os produtos dela continuam existindo, mas ficam sem categoria.')) return;
  try {
    const res = await fetch(`${API}/api/categories/${id}`, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) { showToast('Erro ao excluir'); return; }
    if (configActiveCategory === id) configActiveCategory = null;
    await loadCatalog();
    renderConfigCategories();
  } catch (e) { showToast('Erro de conexão'); }
}

// ── Configurações: produtos ──────────────────────────
function renderConfigProducts() {
  const cat = categories.find(c => c.id === configActiveCategory);
  document.getElementById('config-products-title').textContent = cat ? cat.name : 'Categorias';
  const addBtn = document.getElementById('config-products-add');
  addBtn.classList.toggle('hidden', !cat);
  const list = document.getElementById('config-products-list');
  if (!cat) { list.innerHTML = '<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px">Selecione ou crie uma categoria</div>'; return; }
  const prods = products.filter(p => p.category_id === cat.id);
  if (!prods.length) { list.innerHTML = '<div style="color:var(--text2);font-size:13px;text-align:center;padding:20px">Nenhum produto nesta categoria</div>'; return; }
  list.innerHTML = prods.map(p => `
    <div class="cfg-prod-row">
      <div class="img" style="${p.image_url ? `background-image:url('${p.image_url}');background-size:cover` : ''}"></div>
      <div class="nm">${p.name}${p.available === false ? ' <span class="tag off">indisponível</span>' : ''}<small>${p.description || ''}</small></div>
      <div class="pr">${fmt(p.price)}</div>
      <button data-edit="${p.id}">✎</button>
      <button data-del="${p.id}">🗑</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => openProductModal(btn.dataset.edit)));
  list.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => deleteProduct(btn.dataset.del)));
}

document.getElementById('config-products-add').addEventListener('click', () => openProductModal(null));

function openProductModal(productId) {
  const prod = products.find(p => p.id === productId) || null;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'prod-modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h2>${prod ? 'Editar produto' : 'Novo produto'}</h2>
      <div class="field-group"><label>Nome</label><input id="prod-name" value="${prod?.name || ''}"></div>
      <div class="field-group"><label>Descrição</label><textarea id="prod-desc" rows="2">${prod?.description || ''}</textarea></div>
      <div class="field-row">
        <div class="field-group"><label>Preço (R$)</label><input id="prod-price" type="number" step="0.01" value="${prod?.price ?? ''}"></div>
        <div class="field-group"><label>Código</label><input id="prod-code" value="${prod?.code || ''}"></div>
      </div>
      <div class="field-group">
        <label>Foto do produto</label>
        <div style="display:flex;align-items:center;gap:10px">
          <div id="prod-image-preview" style="width:56px;height:56px;border-radius:10px;background:var(--bg);flex-shrink:0;${prod?.image_url ? `background-image:url('${prod.image_url}');background-size:cover;background-position:center` : ''}"></div>
          <button type="button" id="prod-image-pick" style="height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:500">📷 Escolher da galeria</button>
          <span id="prod-image-status" style="font-size:11.5px;color:var(--text2)"></span>
        </div>
        <input type="file" id="prod-image-file" accept="image/*" class="hidden">
      </div>
      ${prod ? `
        <label class="toggle-row"><input type="checkbox" id="prod-active" ${prod.active !== false ? 'checked' : ''}> Produto ativo</label>
        <label class="toggle-row"><input type="checkbox" id="prod-available" ${prod.available !== false ? 'checked' : ''}> Disponível pra venda agora</label>
      ` : ''}
      <div id="prod-error" style="color:var(--danger);font-size:12px;min-height:16px"></div>
      <div class="modal-actions">
        <button id="prod-cancel">Cancelar</button>
        <button class="primary" id="prod-save">Salvar</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  let prodImageUrl = prod?.image_url || null;
  const statusEl = backdrop.querySelector('#prod-image-status');
  const previewEl = backdrop.querySelector('#prod-image-preview');
  backdrop.querySelector('#prod-image-pick').addEventListener('click', () => backdrop.querySelector('#prod-image-file').click());
  backdrop.querySelector('#prod-image-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusEl.textContent = 'Enviando...';
    try {
      const fd = new FormData();
      fd.append('image', file);
      const res = await fetch(`${API}/api/products/upload`, { method: 'POST', headers: authHeaders(), body: fd });
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = data.error || 'Erro ao enviar'; return; }
      prodImageUrl = data.url;
      previewEl.style.backgroundImage = `url('${data.url}')`;
      previewEl.style.backgroundSize = 'cover';
      previewEl.style.backgroundPosition = 'center';
      statusEl.textContent = 'Foto enviada ✓';
    } catch (err) {
      statusEl.textContent = 'Erro de conexão';
    }
  });
  backdrop.querySelector('#prod-cancel').addEventListener('click', () => backdrop.remove());
  backdrop.querySelector('#prod-save').addEventListener('click', async () => {
    const name = backdrop.querySelector('#prod-name').value.trim();
    const price = parseFloat(backdrop.querySelector('#prod-price').value);
    const errEl = backdrop.querySelector('#prod-error');
    if (!name || !(price >= 0)) { errEl.textContent = 'Nome e preço são obrigatórios'; return; }
    const payload = {
      name, price,
      description: backdrop.querySelector('#prod-desc').value.trim() || null,
      code: backdrop.querySelector('#prod-code').value.trim() || null,
      image_url: prodImageUrl,
    };
    if (!prod) payload.category_id = configActiveCategory;
    if (prod) {
      payload.active = backdrop.querySelector('#prod-active').checked;
      payload.available = backdrop.querySelector('#prod-available').checked;
    }
    try {
      const res = await fetch(`${API}/api/products${prod ? '/' + prod.id : ''}`, {
        method: prod ? 'PATCH' : 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Erro ao salvar'; return; }
      backdrop.remove();
      await loadCatalog();
      renderConfigProducts();
      showToast('Produto salvo!');
    } catch (e) { errEl.textContent = 'Erro de conexão'; }
  });
}

async function deleteProduct(id) {
  if (!confirm('Excluir este produto?')) return;
  try {
    const res = await fetch(`${API}/api/products/${id}`, { method: 'DELETE', headers: authHeaders() });
    if (!res.ok) { showToast('Erro ao excluir'); return; }
    await loadCatalog();
    renderConfigProducts();
  } catch (e) { showToast('Erro de conexão'); }
}

// ── Init ─────────────────────────────────────────────
if (TOKEN) {
  try { CURRENT_USER = JSON.parse(localStorage.getItem('seama_user') || 'null'); } catch (e) {}
  enterApp();
} else {
  loadOperators();
}
</script>
</body>
</html>
